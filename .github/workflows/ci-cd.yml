name: 🚀 CyberLife CI/CD

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # 🔍 Lint & Security
  lint-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Rustfmt & Clippy
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: -- --check
          
      - name: Clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: -- -D warnings -A clippy::manual_map -A clippy::wrong_self_convention

      - name: ESLint (Frontend)
        run: |
          cd frontend
          npm ci
          npm run lint

  # 🧪 Backend Tests
  test-backend:
    needs: lint-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Test Backend
        run: cargo test --workspace --verbose

  # 🧪 Frontend Tests  
  test-frontend:
    needs: lint-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Test Frontend
        run: |
          cd frontend
          npm ci
          npm test

  # 🏗️ Build & Push Backend
  build-backend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:backend-latest
            ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:backend-${{ github.sha }}

  # 🏗️ Build & Push Frontend
  build-frontend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:frontend-latest
            ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:frontend-${{ github.sha }}

  # 🚀 Deploy Preview (PR)
  preview:
    needs: [build-backend, build-frontend]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ CI/CD passed! Preview: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            })

  # 🌐 Deploy Production (main)
  deploy-prod:
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to production..."
          echo "Backend: ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:backend-latest"
          echo "Frontend: ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:frontend-latest"
